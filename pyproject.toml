[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eod-theory"
version = "1.0.0"
description = "Finite reference engine for Evidence-Obligation Database Theory"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Mohammad Amir Khusru Akhtar"}]

[tool.setuptools.packages.find]
include = ["eod*"]
